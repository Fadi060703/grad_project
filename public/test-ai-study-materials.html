<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AI Study Materials Test</title>
</head>
<body>
  <h1>AI Study Materials Test</h1>

  <label>
    Student JWT Token:
    <input id="token" type="text" />
  </label>

  <br /><br />

  <label>
    Course File ID:
    <input id="courseFileId" type="number" />
  </label>

  <br /><br />

  <button id="downloadFlashcards">Download Flashcards HTML</button>
  <button id="downloadSummary">Download Summary HTML</button>

  <script>
    const downloadHtml = async (url, filename) => {
      const token = document.getElementById("token").value.trim();

      const response = await fetch(url, {
        headers: {
          Authorization: `Bearer ${token}`,
        },
      });

      if (!response.ok) {
        alert(await response.text());
        return;
      }

      const html = await response.text();
      const blob = new Blob([html], { type: "text/html" });
      const objectUrl = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = objectUrl;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(objectUrl);
    };

    document.getElementById("downloadFlashcards").addEventListener("click", () => {
      const courseFileId = document.getElementById("courseFileId").value.trim();
      downloadHtml(
        `/api/course-files/${courseFileId}/flashcards-html`,
        `course-file-${courseFileId}-flashcards.html`,
      );
    });

    document.getElementById("downloadSummary").addEventListener("click", () => {
      const courseFileId = document.getElementById("courseFileId").value.trim();
      downloadHtml(
        `/api/course-files/${courseFileId}/summary-html`,
        `course-file-${courseFileId}-summary.html`,
      );
    });
  </script>
</body>
</html>
