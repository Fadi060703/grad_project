<!doctype html>
<html>
  <body>
    <h1>Push test</h1>
    <p>Paste a STUDENT JWT and the VAPID public key generated by web-push.</p>

    <label>JWT</label><br />
    <textarea id="token" rows="4" cols="80"></textarea><br />

    <label>VAPID public key</label><br />
    <input id="vapid" size="100" placeholder="PASTE_PUBLIC_KEY_HERE" /><br /><br />

    <button id="subscribe">Subscribe this browser</button>
    <button id="send">Send test to student_id 1</button>

    <pre id="log"></pre>

    <script>
      const log = (message) => {
        document.getElementById("log").textContent += message + "\n";
      };

      const urlBase64ToUint8Array = (base64String) => {
        const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
        const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
        const rawData = atob(base64);
        return Uint8Array.from([...rawData].map((char) => char.charCodeAt(0)));
      };

      const getToken = () => document.getElementById("token").value.trim();

      document.getElementById("subscribe").onclick = async () => {
        const token = getToken();
        const publicKey = document.getElementById("vapid").value.trim();
        if (!token || !publicKey) return log("JWT and VAPID public key are required");

        const registration = await navigator.serviceWorker.register("/sw.js");
        const permission = await Notification.requestPermission();
        if (permission !== "granted") return log("Notification permission not granted");

        let subscription = await registration.pushManager.getSubscription();
        if (!subscription) {
          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(publicKey),
          });
        }

        const response = await fetch("/api/push-subscriptions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify(subscription.toJSON()),
        });

        log(`Subscribe response ${response.status}: ${await response.text()}`);
      };

      document.getElementById("send").onclick = async () => {
        const token = getToken();
        if (!token) return log("JWT is required");

        const response = await fetch("/api/dev/test-notification", {
          method: "POST",
          headers: { Authorization: `Bearer ${token}` },
        });

        log(`Send response ${response.status}: ${await response.text()}`);
      };
    </script>
  </body>
</html>
